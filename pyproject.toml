[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "proofside"
version = "0.1.0"
description = "A small formal-verification sidecar for typed mathematical Python"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
dependencies = [
    "nagini==1.3.1",
]

[project.urls]
Repository = "https://github.com/kli0n2323/proofside"

[project.scripts]
proofside = "proofside.cli:main"

[tool.setuptools.packages.find]
include = ["proofside"]

name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          expected_tag = f"v{project['version']}"
          actual_tag = os.environ["GITHUB_REF_NAME"]
          if actual_tag != expected_tag:
              raise SystemExit(
                  f"release tag {actual_tag!r} does not match package version {expected_tag!r}"
              )
          print(f"release tag matches package version: {actual_tag}")
          PY
      - name: Install build frontend
        run: python -m pip install build
      - name: Build wheel and source distribution
        run: python -m build
      - name: Inspect distributions
        run: |
          python - <<'PY'
          from pathlib import Path

          files = sorted(path for path in Path("dist").iterdir() if path.is_file())
          wheels = [path for path in files if path.suffix == ".whl"]
          source_distributions = [path for path in files if path.name.endswith(".tar.gz")]
          expected_files = set(wheels + source_distributions)
          if len(wheels) != 1 or len(source_distributions) != 1 or set(files) != expected_files:
              names = ", ".join(path.name for path in files) or "<none>"
              raise SystemExit(
                  "expected exactly one wheel and one .tar.gz source distribution; "
                  f"found: {names}"
              )
          for path in files:
              print(path.name)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/proofside
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Inspect approved distributions
        run: ls -la dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/

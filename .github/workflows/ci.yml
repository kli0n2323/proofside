name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fast-tests:
    name: Fast tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: proofside --help
      - run: python -m unittest discover -s tests -v

  lean-integration:
    name: Lean integration (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: curl --fail --show-error --silent --location https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --no-modify-path
      - run: $HOME/.elan/bin/lean --version
      - run: python -m pip install .
      - run: PATH="$HOME/.elan/bin:$PATH" proofside check examples/sidecar/shot_budget_plain.py::allocate_remaining --contract examples/sidecar/shot_budget_contract.json --backend lean
      - run: PATH="$HOME/.elan/bin:$PATH" python -m unittest tests.test_integration -v
        env:
          PROOFSIDE_RUN_LEAN: "1"
